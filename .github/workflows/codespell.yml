---
name: Codespell

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Codespell
        uses: codespell-project/actions-codespell@v2
        with:
          # Keep in sync with [tool.codespell] ignore-words-list in pyproject.toml
          ignore_words_list: mape,ans,2st,fo,nd,te,fpr,coo,rouge,SME,NoES,lama
